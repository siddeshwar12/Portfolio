name: Verify portfolio

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify page structure
        run: |
          test -f index.html
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); if (!html.includes('<title>') || !html.includes('three')) process.exit(1)"
